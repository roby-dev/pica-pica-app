<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <title>Pica-Pica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17151f" />
    <meta name="description" content="Registra y entiende tus gastos hormiga." />
    <!-- iPhone: open without Safari chrome, draw under the status bar (the app pads the safe area). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pica-Pica" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Set the theme before first paint to avoid a light/dark flash.
      (function () {
        var pref = localStorage.getItem('pp-theme') || 'dark';
        var dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
      // iOS ignores user-scalable=no, so block the pinch gesture here. Double-tap zoom is handled in CSS.
      document.addEventListener('gesturestart', function (event) {
        event.preventDefault();
      });
    </script>
    <!-- Paint the page colour before the stylesheet arrives so launch never flashes white. -->
    <style>
      html[data-theme='dark'] { background: #17151f; }
      html[data-theme='light'] { background: #f4f7fb; }
    </style>
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <pp-root></pp-root>
    <noscript>Activa JavaScript para usar Pica-Pica.</noscript>
  </body>
</html>
